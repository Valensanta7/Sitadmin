<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contratista Rural{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; font-size: 0.95rem; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .nav-link.active { font-weight: 600; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .badge-cosecha   { background:#198754; }
    .badge-siembra   { background:#0d6efd; }
    .badge-fumigacion{ background:#6f42c1; }
    .badge-otro      { background:#6c757d; }
    .table th { font-size:.82rem; text-transform:uppercase; letter-spacing:.5px; color:#6c757d; }
    .alerta-cheque { border-left: 4px solid #dc3545; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-tractor me-2"></i>Contratista Rural</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/trabajos' in request.path %}active{% endif %}" href="/trabajos">
            <i class="bi bi-file-earmark-text me-1"></i>Trabajos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/cheques' in request.path %}active{% endif %}" href="/cheques">
            <i class="bi bi-cash-stack me-1"></i>Cheques
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/clientes' in request.path %}active{% endif %}" href="/clientes">
            <i class="bi bi-people me-1"></i>Clientes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/gastos' in request.path %}active{% endif %}" href="/gastos">
            <i class="bi bi-receipt me-1"></i>Gastos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/cereales' in request.path %}active{% endif %}" href="/cereales">
            <i class="bi bi-basket me-1"></i>Cereales
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/facturas' in request.path %}active{% endif %}" href="/facturas">
            <i class="bi bi-file-earmark-check me-1"></i>Facturas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/reporte' in request.path %}active{% endif %}" href="/reporte">
            <i class="bi bi-bar-chart-line me-1"></i>Reporte
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
